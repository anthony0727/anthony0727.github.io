---
layout: default
---

<div class="home">
  <!-- about -->
  <div class="about">
    <br>
    <p>I'm interested in various aspects of ML, especialy RL, to solve important problems in the world.</p>
    <br>
    <p>
    <a href="/assets/anthony_resume_rl.pdf" download onclick="gtag('event', 'download_cv', {
      'event_category': 'Download',
      'event_label': 'CV',
      'value': 1
    });">CV</a>
    </p>
    <br>
  </div>
  
  <br>
  <ul class="posts">
    {% for post in site.posts %}
      <li>
        <span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span>
        <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        <br>
        {{ post.excerpt }}
      </li>
    {% endfor %}
  </ul>

</div>
